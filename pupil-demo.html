<style>
:root{--bg:#F4F1EA;--card:#FFFFFF;--ink:#1F2937;--soft:#4B5563;--main:#1E3A8A;--main-soft:#E0ECFF;--line:#D6DCE8;--note:#FFF8E6;--note-line:#E9C96B;--calm:#E7F5EC;--calm-ink:#166534}
*{box-sizing:border-box}
html{font-size:18px}
html[data-size="l"]{font-size:21px}html[data-size="xl"]{font-size:24px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.4}
html[data-font="easy"] body{font-family:Verdana,Tahoma,"Segoe UI",sans-serif;letter-spacing:.03em;word-spacing:.1em;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:1rem 1rem 2rem;display:flex;flex-direction:column;gap:.9rem;min-height:100vh}
header{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}
h1{flex:1;margin:0;font-size:1.45rem}
h2{margin:0;font-size:1rem;letter-spacing:.03em;color:var(--main)}
button{font:inherit;color:inherit;cursor:pointer}
.btn{min-height:56px;min-width:56px;padding:0 1rem;border:2px solid var(--main);border-radius:16px;background:var(--card);color:var(--main);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:.4rem}
.btn.big{width:100%;min-height:60px;background:var(--main);color:#fff;font-size:1.05rem}
.btn[aria-pressed="true"]{background:var(--main);color:#fff}
button:focus-visible{outline:4px solid #F59E0B;outline-offset:2px}
.card{background:var(--card);border-radius:22px;padding:1rem;box-shadow:0 1px 3px rgba(31,41,55,.1)}
.note{background:var(--note);border:2px solid var(--note-line);border-radius:18px;padding:.8rem 1rem}
.note h2{color:var(--ink);font-size:1.05rem;letter-spacing:0;margin-bottom:.2rem}
.note p{margin:.15rem 0;font-size:1rem}
.now{display:flex;flex-direction:column;align-items:center;gap:.5rem;text-align:center}
.now h2{align-self:flex-start}
.sym{width:112px;height:112px;border-radius:28px;background:var(--main-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:2.2rem;font-weight:700;color:var(--main);flex:none}
.sym img{width:84%;height:84%;object-fit:contain}
.sym.sm{width:64px;height:64px;border-radius:18px;font-size:1.3rem}
.title{font-size:2rem;font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.facts{display:flex;flex-wrap:wrap;gap:.5rem 1.2rem;justify-content:center;font-size:1.1rem}
.fact{display:inline-flex;align-items:center;gap:.45rem}
.fact svg{width:28px;height:28px;flex:none}
.who{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.8rem;font-weight:700;overflow:hidden;flex:none}
.who img{width:100%;height:100%;object-fit:cover}
.count{width:100%;margin-top:.3rem}
.blocks{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.blocks i{height:16px;border-radius:99px;background:var(--line);border:1px solid #9AA6BC}
.blocks i.on{background:var(--main);border-color:var(--main)}
.count p{margin:.35rem 0 0;font-size:1rem}
.next{display:flex;align-items:center;gap:.8rem}
.next .title{font-size:1.45rem}
.next h2{color:var(--soft)}
.next small{display:block;font-size:.95rem;color:var(--soft)}
.day{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.6rem}
.day li{display:flex;align-items:center;gap:.8rem;background:var(--card);border-radius:18px;padding:.6rem .8rem;border:2px solid transparent}
.day li.cur{border-color:var(--main)}
.day li.done{opacity:.6}
.day .t{font-size:1.2rem;font-weight:700;overflow-wrap:anywhere}
.day small{display:block;font-size:.95rem;color:var(--soft)}
.day .tag{font-size:.8rem;font-weight:700;color:var(--main)}
.seg{display:flex;gap:.5rem}.seg .btn{flex:1}
.panel{display:flex;flex-direction:column;gap:.6rem}
.panel p{margin:0;font-weight:700}
footer{margin-top:auto;font-size:.8rem;color:var(--soft);text-align:center}
[hidden]{display:none!important}
@media (prefers-contrast:more){.card,.day li{border:2px solid var(--ink)}.blocks i{border-color:var(--ink)}}
@media print{.btn,#panel{display:none!important}body{background:#fff}}
</style>

    say.unshift('Now: '+x.s+(x.r?', in '+x.r:'')+(names(x).length?', with '+andList(names(x)):'')+'. '+minsText(left)+until+'.')}
  if(N.day&&N.next){var y=N.next,first=!N.cur&&!N.pl.some(function(z){return z.to<=N.m&&!z.home});
    h+='<section class="card next">'+symHtml(y,true)+'<div><h2>'+(N.cur?'NEXT':first?'FIRST TODAY':'NEXT')+'</h2><div class="title">'+esc(y.s)+'</div>'+(N.cur?'':'<small>at '+esc(y.st)+'</small>')+(!N.cur&&(y.r||y.a.length)?'<small>'+esc([y.r,names(y).length?'with '+andList(names(y)):''].filter(Boolean).join(', '))+'</small>':'')+'</div></section>';
    say.push((N.cur?'Next: ':first?'First today: ':'Next: ')+y.s+(N.cur?'':' at '+y.st)+'.')}
  if(after){h+='<section class="card now"><h2>TODAY</h2><div class="title">School has finished</div></section>';say.unshift('School has finished for today.');
    if(t){var tp=plan(t,false).filter(function(z){return !z.brk})[0];if(tp){h+='<section class="card next">'+symHtml(tp,true)+'<div><h2>'+esc((tomIsNext?'Tomorrow':P.days[t.d]).toUpperCase())+' STARTS WITH</h2><div class="title">'+esc(tp.s)+'</div></div></section>';say.push((tomIsNext?'Tomorrow':P.days[t.d])+' starts with '+tp.s+'.')}}}
  SAY='Hi '+P.name+'. '+say.join(' ');
  return h+'<button type="button" class="btn big" data-go="day">My whole day</button>'}
function dayHtml(){var N=nowParts(),t=nextDay(N.date),day=WHICH==='next'?t:N.day,tomLab=(function(){var d=new Date(N.date+'T12:00:00');d.setDate(d.getDate()+1);return t&&isoOf(d)===t.date?'Tomorrow':t?P.days[t.d]:'Next day'})();
  var h='<div class="seg" role="group" aria-label="Which day"><button type="button" class="btn" data-which="today" aria-pressed="'+(WHICH!=='next')+'">Today</button><button type="button" class="btn" data-which="next" aria-pressed="'+(WHICH==='next')+'"'+(t?'':' disabled')+'>'+esc(tomLab)+'</button></div>';
  var say=[WHICH==='next'?tomLab+'.':'Today.'];
  if(!day){h+='<section class="card now"><div class="title">No school</div></section>';say.push('No school.')}
  else{var pl=plan(day,false);h+='<ol class="day">'+pl.map(function(x){var cur=WHICH!=='next'&&N.m>=x.from&&N.m<x.to&&!x.home,done=WHICH!=='next'&&N.m>=x.to&&!x.home;say.push(x.st+', '+x.s+'.');
      return '<li class="'+(cur?'cur':done?'done':'')+'">'+symHtml(x,true)+'<div>'+(cur?'<span class="tag">NOW</span>':'')+'<div class="t">'+esc(x.s)+'</div><small>'+esc([x.st,x.r,names(x).length?'with '+andList(names(x)):''].filter(Boolean).join(' · '))+'</small></div></li>'}).join('')+'</ol>'}
  SAY=say.join(' ');
  return h+'<button type="button" class="btn big" data-go="home">Back to now</button>'}
/* read aloud: only with a voice that is on this device (nothing is sent anywhere); no such voice, no button */
var synth=null,VOICE=null;try{synth=window.speechSynthesis||null}catch(_){}
function pickVoice(){VOICE=null;if(!synth)return;var v=[];try{v=synth.getVoices()||[]}catch(_){}
  v=v.filter(function(x){return x.localService===true});
  VOICE=v.filter(function(x){return /^en-GB/i.test(x.lang)})[0]||v.filter(function(x){return /^en/i.test(x.lang)})[0]||null;
  var b=document.getElementById('say');if(b)b.hidden=!VOICE}
function speak(){if(!synth||!VOICE)return;try{if(synth.speaking){synth.cancel();return}var u=new SpeechSynthesisUtterance(SAY);u.voice=VOICE;u.lang=VOICE.lang;u.rate=.9;synth.speak(u)}catch(_){}}
function applyDisplay(){var r=document.documentElement,s=store.get('ttp-size'),f=store.get('ttp-font');if(s==='l'||s==='xl')r.setAttribute('data-size',s);else r.removeAttribute('data-size');if(f==='easy')r.setAttribute('data-font','easy');else r.removeAttribute('data-font')}
var PANEL=false;
function panelHtml(){var s=store.get('ttp-size'),f=store.get('ttp-font');var b=function(k,v,l,cur){return '<button type="button" class="btn" data-set="'+k+'" data-v="'+v+'" aria-pressed="'+(cur===v)+'">'+l+'</button>'};
  return '<section class="card panel" id="panel"><p id="pSize">Text size</p><div class="seg" role="group" aria-labelledby="pSize">'+b('size','','Normal',s)+b('size','l','Big',s)+b('size','xl','Biggest',s)+'</div><p id="pFont">Letters</p><div class="seg" role="group" aria-labelledby="pFont">'+b('font','','Normal',f)+b('font','easy','Easy read',f)+'</div></section>'}
function render(keep){if(!P){app.innerHTML='<section class="card now"><div class="title">No timetable here yet</div><p>Ask an adult for a new copy.</p></section>';return}
  var body=VIEW==='day'?dayHtml():homeHtml();
  var pub=new Date(P.published),old=!isNaN(pub)&&(Date.now()-pub.getTime())>14*864e5;
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var foot=(isNaN(pub)?'':'Updated '+pub.getDate()+' '+MON[pub.getMonth()]+'. ')+(old?'This copy is getting old. Ask an adult for a new one. ':'')+(P.credit?esc(P.credit):'');
  var focus=keep&&document.activeElement&&document.activeElement.getAttribute?[document.activeElement.getAttribute('data-go'),document.activeElement.getAttribute('data-which'),document.activeElement.id,document.activeElement.getAttribute('data-set'),document.activeElement.getAttribute('data-v')]:null;
  app.innerHTML='<header><h1>'+(P.name?'Hi '+esc(P.name):'My timetable')+'</h1><button type="button" class="btn" id="say"'+(VOICE?'':' hidden')+'><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>Read to me</button><button type="button" class="btn" id="aa" aria-expanded="'+PANEL+'" aria-label="Text size and letters">Aa</button></header>'+(PANEL?panelHtml():'')+body+'<footer>'+foot+'</footer>';
  if(focus){var sel=focus[2]?'#'+focus[2]:focus[3]!=null?'[data-set="'+focus[3]+'"][data-v="'+focus[4]+'"]':focus[0]?'[data-go]':focus[1]?'[data-which="'+focus[1]+'"]':'';var el=sel&&app.querySelector(sel);if(el)el.focus()}}
app.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('button');if(!b)return;
  if(b.id==='say'){speak();return}
  if(b.id==='aa'){PANEL=!PANEL;render(true);return}
  if(b.dataset.set){store.set(b.dataset.set==='size'?'ttp-size':'ttp-font',b.dataset.v);applyDisplay();render(true);return}
  if(b.dataset.go){VIEW=b.dataset.go;WHICH='today';try{if(synth)synth.cancel()}catch(_){}render();var n=app.querySelector('[data-go]');if(n)n.focus();window.scrollTo(0,0);return}
  if(b.dataset.which){WHICH=b.dataset.which;render(true);return}});
applyDisplay();pickVoice();
try{if(synth&&'onvoiceschanged' in synth)synth.onvoiceschanged=pickVoice}catch(_){}
if(P&&P.name)document.title=P.name+': my timetable';
render();
setInterval(function(){if(!(synth&&synth.speaking))render(true)},20000);
})();
</script>
