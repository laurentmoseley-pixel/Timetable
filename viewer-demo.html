<!-- The Timetable Viewer: a read-only, phone-first view of a staff-safe copy published from the
     Timetable Builder (Setup, Staff viewer). It never changes anything, sends nothing anywhere and has
     no AI. It reads the copy inside this file, a timetable-published.json next to it on a web site, or
     a file someone chooses. What it shows is only what the school chose to publish. -->
<style>

  --gorse:#FB923C;--gorse-soft:#2A1A0E;--ok:#4ADE80;--ok-soft:#0D2416;--clash:#F87171;--clash-soft:#2A1215;--amber:#FBBF24;--hover:#1C2029;--shadow:0 0 0 1px #232731}}
:root[data-theme="dark"]{--paper:#0F1115;--panel:#161920;--ink:#E6E8EE;--muted:#A3A9B7;--line:#232731;--line-strong:#343A47;--heather:#22D3EE;--heather-soft:#0E2A33;--heather-line:#155E75;--brand-bg:#22D3EE;--on-brand:#0B0D10;--focus:#67E8F9;
  --gorse:#FB923C;--gorse-soft:#2A1A0E;--ok:#4ADE80;--ok-soft:#0D2416;--clash:#F87171;--clash-soft:#2A1215;--amber:#FBBF24;--hover:#1C2029;--shadow:0 0 0 1px #232731}
:root[data-theme="contrast"]{--paper:#FFFFFF;--panel:#FFFFFF;--ink:#000000;--muted:#1F1F1F;--line:#000000;--line-strong:#000000;--heather:#0000C8;--heather-soft:#E6E6FF;--heather-line:#0000C8;--brand-bg:#0000C8;--on-brand:#FFFFFF;--focus:#000000;
  --gorse:#7A2E00;--gorse-soft:#FFF6D6;--ok:#005A00;--ok-soft:#E6F5E6;--clash:#A00000;--clash-soft:#FFE8E8;--amber:#7A3B00;--hover:#F0F0F0;--shadow:0 0 0 2px #000}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.45 var(--font);-webkit-text-size-adjust:100%;min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.rows{list-style:none;margin:0;padding:0}

.rows li:first-child{border-top:0}

.rows li.brk{padding:6px 0;color:var(--muted);font-size:13px}

.item{display:block;padding:2px 0}
.item.k-cover,.item.k-extra{color:var(--gorse);font-weight:600}
.item.k-cover{display:block;border-left:4px solid #C2410C;padding-left:6px;margin-left:-2px;color:var(--ink)}.item.k-cover .lr .ls{color:var(--ink)}
.item.k-away,.item.k-freed{color:var(--muted);font-style:italic}
.item.k-drive{color:var(--amber)}
.item.free{color:var(--muted)}
.chg{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--on-brand);background:var(--brand-bg);border-radius:999px;padding:0 7px;vertical-align:1px}
.week{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:760px){.week{grid-template-columns:repeat(var(--nd,5),minmax(0,1fr))}.week .rows li{grid-template-columns:1fr;gap:2px}}
.week .card{padding:10px 12px}

.showbar{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:0 0 10px;font-size:14px}.showbar span{color:var(--muted)}.showbar label{display:inline-flex;gap:5px;align-items:center;min-height:32px;cursor:pointer}
.lookbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.vsheet{background:#fff;color:#111;border-radius:12px;padding:12px;border:1px solid var(--line)}.vsheet h3{font-size:22px;margin:0 0 8px}
.vweek{display:grid;gap:8px;overflow-x:auto}.vcol{display:flex;flex-direction:column;gap:6px;min-width:110px}
.vday-h{font-weight:700;font-size:16px;text-align:center;padding:4px;border-bottom:2px solid #111}
.vcard{display:flex;align-items:center;gap:8px;border:3px solid #bbb;border-radius:10px;padding:6px;background:#fff;color:#111;break-inside:avoid;page-break-inside:avoid}
.vweek .vcard{flex-direction:column;text-align:center;gap:3px;padding:6px 4px}
.vtime{font-size:12px;font-weight:600;color:#333;white-space:nowrap}.vtime i{display:block;font-style:normal;font-weight:400;font-size:12px}
.vname{font-weight:700;font-size:15px;line-height:1.2}.vname small{display:block;font-weight:400;font-size:11px;color:#444;margin-top:2px}
.vsym{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;flex:none}
.syi{display:block;width:100%;height:100%;background:center/contain no-repeat;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.vsym.none{border-radius:8px;font-weight:800;font-size:22px;color:#222}
.vbrk{border-style:dashed;background:#f6f6f6}.vfree{border-style:dotted;background:#fafafa;color:#555}
.vpage{max-width:780px}.vpage-h{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px solid #111;margin-bottom:10px;padding-bottom:4px;gap:10px}
.vday-big{font-size:30px;font-weight:800}.vlist{display:flex;flex-direction:column;gap:8px}.vlist .vcard{padding:8px 12px;gap:16px}
.vlist .vtime{width:78px;font-size:17px}.vlist .vtime i{font-size:13px}.vlist .vsym.big{width:88px;height:88px}.vlist .vsym.none.big{font-size:30px}
.vlist .vname{font-size:24px}.vlist .vname small{font-size:14px}.vcredit{font-size:9px;color:#666;margin:6px 0 0}
@media (max-width:600px){.vlist .vname{font-size:19px}.vlist .vsym.big{width:64px;height:64px}.vlist .vtime{width:60px;font-size:14px}.vday-big{font-size:22px}}
@media print{.noprint,.pfind,.pick{display:none!important}.vsheet{border:0;padding:0}.vcard,.vsym.none,.vbrk,.vfree{-webkit-print-color-adjust:exact;print-color-adjust:exact}main{padding:0!important;max-width:none!important}}
.whorow{display:flex;align-items:center;gap:8px;min-width:0}.chgwho{flex:none;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);font:inherit;font-size:13px;font-weight:600;cursor:pointer}.chgwho:hover{background:var(--hover)}@media print{.chgwho{display:none}}
.pfind{margin:0 0 12px}.pfind input{width:100%;max-width:420px;min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);padding:0 12px;font:inherit}
.hits{display:flex;flex-direction:column;gap:4px;margin-top:6px;max-width:420px}
.hit{display:flex;justify-content:space-between;gap:10px;align-items:center;text-align:left;min-height:44px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;cursor:pointer}
.hit span{color:var(--muted);font-size:13px}.hit.on{border-color:var(--heather);box-shadow:inset 0 0 0 1px var(--heather)}
.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
table.wk{width:100%;border-collapse:collapse;table-layout:fixed;min-width:720px;font-size:12px}

.pick{display:flex;gap:8px;align-items:center;margin:0 0 12px;flex-wrap:wrap}
.pick select{min-height:44px;border-radius:10px;border:1px solid var(--line-strong);background:var(--panel);padding:0 10px;flex:1;min-width:0;max-width:420px}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:10px;overflow:hidden}

.cover li{grid-template-columns:92px 1fr}
.by{font-weight:700}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:18px 0}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center}

  var c=D.lessons.filter(function(L){return L.d===d&&L.p===i&&L.st.indexOf(code)>=0&&(!x.g||L.g===x.g)});
  for(var k=0;k<c.length;k++){var L=c[k],head=L.g+', '+L.s;if(t===head||t.indexOf(head+', ')===0||t.indexOf(head+' (')===0){var rest=t.slice(head.length).replace(/^, /,'').replace(/ \(swapped with [^)]*\)$/,'');return{L:L,room:rest,swap:(t.match(/\(swapped with ([^)]*)\)$/)||[])[1]||''}}}
  return null}
function withNames(L,code){return L.st.filter(function(c){return c!==code}).map(nameOf).join(', ')}

    return '<span class="lr"><b class="ls">'+esc(x.t)+'</b></span>'}

    '<span class="ll"><span class="lk">Room</span> '+(m.room?esc(m.room):'none')+(m.room&&L.r&&m.room!==L.r?' <span class="badge chg">Changed</span>':'')+'</span>'+

/* ---------- Today's changes: the day as published, against the usual week ---------- */
function todayChanges(code,date,d){if(!hasDay(date))return [];var out=[];
  for(var i=0;i<nLes();i++){var p=lesPer(i),it=dayItems(code,date,d,i),u=usual(code,d,i),lab=p.label.replace(/^Period\s*/i,'P');
    it.forEach(function(x){if(x.k==='cover')out.push({b:'Cover',c:'cov',t:'You are covering '+String(x.t).replace(/^Cover: /,'')+', '+p.label});
      else if(x.k==='extra')out.push({b:'Extra',c:'cov',t:String(x.t).replace(/^Extra: /,'')+', '+p.label});
      else if(x.k==='lesson'){var m=lessonOf(code,d,i,x);if(m&&m.room&&m.L.r&&m.room!==m.L.r)out.push({b:'Room',c:'room',t:m.L.s+' is in '+m.room+' (usually '+m.L.r+'), '+p.label});if(m&&m.swap)out.push({b:'Swap',c:'room',t:m.L.s+': swapped with '+m.swap+', '+p.label})}});

    if(!it.some(function(x){return x.k==='away'}))u.forEach(function(x){var head=String(x.t).split(', ').slice(0,2).join(', ');if(lessons.indexOf(head)<0)out.push({b:'Off',c:'off',t:head+' is not with you today, '+p.label})})}
  return out}
/* ---------- Now and Next: always there on today, before, during and after school ---------- */
function firstOn(code,date,d){var r=null;D.periods.forEach(function(p){if(r||p.i<0)return;var it=dayItems(code,date,d,p.i);if(it.some(function(x){return x.k!=='away'&&x.k!=='freed'}))r={p:p,it:it}});return r}

function nowNext(code,date,d){var hm=nowHM(),now=minsOf(hm),cur=null,brk=null,next=null;
  D.periods.forEach(function(p){if(!p.start||!p.end)return;var a=minsOf(p.start),b=minsOf(p.end);
    if(now>=a&&now<b){if(p.i<0)brk=p;else cur={p:p,it:dayItems(code,date,d,p.i)}}
    else if(a>=now&&!next&&p.i>=0){var it=dayItems(code,date,d,p.i);if(it.some(function(x){return x.k!=='away'&&x.k!=='freed'}))next={p:p,it:it}}});
  var left=function(p){var a=minsOf(p.start),b=minsOf(p.end),m=Math.max(0,b-now),pc=Math.round(Math.max(0,Math.min(1,(now-a)/Math.max(1,b-a)))*100);

  if(!cur&&!next){var nd=nextDayAfter(date);
    if(nd){var f=firstOn(code,nd.date,nd.d),when=nd.date?nice(nd.date):D.days[nd.d];var tomorrow=(function(){var t=new Date(date+'T12:00:00');t.setDate(t.getDate()+1);return isoOf(t)})();var lab=(nd.date||nd.iso)===tomorrow?'Tomorrow':when;
      h+='<div class="slot"><div class="tag">'+esc(lab)+(f?' · '+esc(f.p.start):'')+'</div><div class="what">'+(f?nnLesson(code,nd.date,nd.d,f):'<span class="lr"><b class="ls">No lessons for you</b></span>')+'</div><div class="when">'+(brk?'':'Nothing more today. ')+(f?esc(f.p.label):'')+'</div></div>'}
    else h+='<div class="slot"><div class="what">Nothing more today.</div></div>'}
  return '<section class="now" aria-live="polite" aria-label="Now and next">'+h+'</section>'}

/* ---------- live from a shared folder (Edge or Chrome on a computer) ----------
   Staff who sync the staff SharePoint library with OneDrive choose that folder once. The Viewer reads
   timetable-published.json from it, and again every 20 seconds when the Timetable Builder has saved a
   newer one, so cover shows as soon as it is arranged. The folder is remembered on this computer. */
var LV={ok:typeof window.showDirectoryPicker==='function'&&!DV,dir:null,perm:'',mod:0,at:0,err:''};
function lvDb(mode,fn){return new Promise(function(res){var rq;try{rq=indexedDB.open('ttv-live',1)}catch(_){res(null);return}rq.onupgradeneeded=function(){rq.result.createObjectStore('h')};rq.onerror=function(){res(null)};
  rq.onsuccess=function(){var db=rq.result;try{var tx=db.transaction('h',mode),r=fn(tx.objectStore('h'));tx.oncomplete=function(){db.close();res(r?r.result:null)};tx.onerror=function(){db.close();res(null)}}catch(_){db.close();res(null)}}})}
function lvRead(manual){if(!LV.dir||LV.perm!=='granted')return Promise.resolve(false);
  return LV.dir.getFileHandle('timetable-published.json').then(function(fh){return fh.getFile()}).then(function(f){if(!manual&&f.lastModified===LV.mod){LV.at=Date.now();lvPaint();return false}
    return f.text().then(function(t){var n=null;try{n=clean(JSON.parse(t))}catch(_){}if(!n){LV.err='The file is being updated; trying again shortly.';lvPaint();return false}
      var was=D,first=!LV.mod;LV.mod=f.lastModified;LV.at=Date.now();LV.err='';D=n;start(!first);
      if(was&&was.published!==n.published){var l=document.getElementById('liveMsg');if(l)l.textContent='Timetable updated.';lvFlash()}return true})}).catch(function(e){LV.err=e&&e.name==='NotFoundError'?'There is no timetable-published.json in that folder yet.':(e&&e.name==='NotAllowedError'?'':String(e&&e.message||e));if(e&&e.name==='NotAllowedError')LV.perm='prompt';lvPaint();if(!D)lvPrompt();return false})}
function lvFlash(){var b=document.getElementById('lvBar');if(b){b.classList.remove('flash');void b.offsetWidth;b.classList.add('flash')}}

  return '<div class="lvbar" id="lvBar" role="status">'+(LV.perm!=='granted'?'<span>Live timetable paused.</span> <button class="btn small" data-act="lvre">Reconnect</button>':LV.err?'<span>'+esc(LV.err)+'</span>':'<span class="dot" aria-hidden="true"></span><span><b>Live</b> · updated '+esc(pt.replace(/^.*, /,''))+(t?' · checked '+pad(t.getHours())+':'+pad(t.getMinutes()):'')+'</span>')+'</div>'}

function lvChoose(){return window.showDirectoryPicker({id:'tt-live',mode:'read'}).then(function(h){LV.dir=h;LV.perm='granted';LV.mod=0;lvDb('readwrite',function(s){return s.put(h,'dir')});closeSheet();return lvRead(true).then(function(ok){if(!ok&&!D)lvPrompt()})}).catch(function(e){if(e&&e.name==='AbortError')return;alertSheet('That folder could not be opened.')})}
function lvReconnect(){if(!LV.dir)return lvChoose();return LV.dir.requestPermission({mode:'read'}).then(function(p){LV.perm=p;return lvRead(true)}).catch(function(){LV.perm='denied';lvPaint()})}
function lvPrompt(){$('#tabs').innerHTML='';$('#main').innerHTML='<div class="card"><h2>'+(LV.dir?'Reconnect to the live timetable':'Connect to the live timetable')+'</h2><p class="sub">'+(LV.dir?'Choose Reconnect to carry on reading "'+esc(LV.dir.name)+'". Your browser asks each time, unless you allow it on every visit.':'Choose the staff timetable folder that OneDrive syncs to this computer (the one with timetable-published.json in it). This is remembered on this computer.')+'</p>'+(LV.err?'<p class="regerr">'+esc(LV.err)+'</p>':'')+'<button class="btn primary" data-act="'+(LV.dir?'lvre':'lvpick')+'">'+(LV.dir?'Reconnect':'Choose the folder…')+'</button> <button class="btn" data-act="file">Open a published file…</button></div>'}
function lvStart(){return lvDb('readonly',function(s){return s.get('dir')}).then(function(h){if(!h||h.kind!=='directory')return false;LV.dir=h;return h.queryPermission({mode:'read'}).then(function(p){LV.perm=p;if(p==='granted')return lvRead(true);if(!D)lvPrompt();else lvPaint();return false})}).catch(function(){return false})}

  var sz=store.get('ttv-size')||'',fn=store.get('ttv-font')||'';var seg2=function(set,label,cur,opts){return '<div class="seg" role="group" aria-label="'+label+'">'+opts.map(function(o){return '<button type="button" data-set="'+set+'" data-v="'+o[0]+'" aria-pressed="'+(cur===o[0])+'">'+o[1]+'</button>'}).join('')+'</div>'};
